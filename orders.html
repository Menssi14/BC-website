<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1F4D3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Broch Orders">
<title>Broch Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Roboto+Slab:wght@500;600;700&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --cream:#F2EADD; --note:#FBF7F0; --green:#1F4D3E; --burgundy:#4A3424; --pink:#F4B5B0; --red:#D64545; --amber:#E0A82E; --go:#3C8C5A; --line:rgba(74,52,36,.14); --line-strong:rgba(74,52,36,.28); --shadow:0 1px 2px rgba(74,52,36,.10),0 2px 10px rgba(74,52,36,.06); --shadow-hover:0 4px 8px rgba(74,52,36,.13),0 10px 28px rgba(74,52,36,.12); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--cream); color:var(--burgundy); font-family:'EB Garamond',Georgia,serif; font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased; min-height:100vh; }

  header{ position:sticky; top:0; z-index:40; background:var(--green); color:var(--cream); padding:13px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 14px rgba(31,77,62,.28); border-bottom:2px solid rgba(244,181,176,.55); }
  .wordmark{ font-family:'Teko',sans-serif; text-transform:uppercase; font-weight:700; font-size:31px; letter-spacing:.06em; line-height:.9; color:var(--cream); white-space:nowrap; display:flex; flex-direction:column; }
  .wordmark small{ font-size:11px; letter-spacing:.36em; font-weight:500; color:var(--pink); margin-top:-1px; }
  .view-title{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.14em; font-size:20px; color:var(--pink); }
  .hbtn{ margin-left:auto; position:relative; cursor:pointer; border:none; background:rgba(242,234,221,.14); color:var(--cream); width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .hbtn:hover{ background:rgba(242,234,221,.26); }
  .hbtn .badge{ position:absolute; top:-4px; right:-4px; background:var(--pink); color:var(--green); font-family:'Teko',sans-serif; font-weight:600; font-size:13px; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  .wrap{ max-width:1120px; margin:0 auto; padding:18px 12px 130px; }
  .grid{ column-gap:12px; column-width:176px; }
  .section-label{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.18em; font-size:14px; color:rgba(74,52,36,.5); font-weight:600; margin:4px 4px 12px; }

  .card{ break-inside:avoid; -webkit-column-break-inside:avoid; margin-bottom:12px; border-radius:12px; background:var(--note); border:1px solid var(--line-strong); border-left-width:4px; box-shadow:var(--shadow); overflow:hidden; cursor:pointer; transition:box-shadow .16s, transform .12s; position:relative; }
  .card:hover{ box-shadow:var(--shadow-hover); transform:translateY(-1px); } .card:active{ transform:scale(.99); }
  .card.u-asap{ border-left-color:var(--red); } .card.u-fcfs{ border-left-color:var(--amber); } .card.u-norush{ border-left-color:var(--go); }
  .card-imgs{ display:grid; gap:2px; } .card-imgs img{ width:100%; display:block; }
  .card-imgs.n1 img{ height:auto; max-height:230px; object-fit:cover; }
  .card-imgs.n2{ grid-template-columns:1fr 1fr; } .card-imgs.n3{ grid-template-columns:1fr 1fr 1fr; }
  .card-imgs.n2 img,.card-imgs.n3 img{ aspect-ratio:1; object-fit:cover; }
  .card-pad{ padding:11px 13px 11px; }
  .card h3{ margin:0 0 3px; font-family:'Roboto Slab',Georgia,serif; font-size:15px; font-weight:600; line-height:1.24; word-break:break-word; }
  .card .contact{ display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--green); text-decoration:none; margin:1px 0 5px; }
  .card .ctext{ font-size:14px; line-height:1.42; white-space:pre-wrap; word-break:break-word; color:rgba(74,52,36,.92); }
  .card-block{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .card-block .bl{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:rgba(74,52,36,.5); margin-bottom:4px; }
  .it-line{ font-size:14px; line-height:1.5; color:rgba(74,52,36,.92); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .it-line b{ font-family:'Teko',sans-serif; font-weight:600; font-size:15px; color:var(--green); }
  .cdot{ width:11px; height:11px; border-radius:50%; border:1px solid rgba(74,52,36,.3); flex:none; display:inline-block; }

  .card-tags{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:9px; }
  .tag{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:13px; font-weight:500; line-height:1; padding:3px 8px 2px; border-radius:6px; background:rgba(74,52,36,.08); color:var(--burgundy); display:flex; align-items:center; gap:5px; }
  .tag .dot{ width:8px; height:8px; border-radius:50%; }
  .tag.qty{ background:rgba(31,77,62,.10); color:var(--green); }
  .tag.due{ background:rgba(214,69,69,.13); color:#a33; } .tag.due.overdue{ background:var(--red); color:#fff; }
  .tag.online{ background:rgba(244,181,176,.32); color:var(--burgundy); }
  .tag.countdown{ background:rgba(74,52,36,.10); color:rgba(74,52,36,.7); }

  .card-bar{ display:flex; align-items:center; gap:2px; padding:4px 6px; border-top:1px solid var(--line); opacity:0; transition:opacity .15s; }
  .card:hover .card-bar{ opacity:1; } @media(hover:none){ .card-bar{ opacity:1; } }
  .card-bar .done-btn{ display:flex; align-items:center; gap:6px; cursor:pointer; border:none; background:none; font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:14px; color:var(--green); padding:5px 8px; border-radius:7px; }
  .card-bar .done-btn:hover{ background:rgba(60,140,90,.12); }
  .icon-btn{ cursor:pointer; border:none; background:none; color:var(--burgundy); width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .icon-btn:hover{ background:rgba(74,52,36,.10); }
  .card-bar .icon-btn{ width:32px; height:32px; } .card-bar .icon-btn svg{ width:17px; height:17px; }
  .card-bar .lbl{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:15px; padding:0 6px; color:var(--burgundy); cursor:pointer; }

  .empty-state{ text-align:center; padding:84px 20px; color:rgba(74,52,36,.55); }
  .hist-btn{ opacity:.55; } .hist-btn:hover{ opacity:1; }
  .hist-box{ background:var(--note); border-radius:16px; max-width:520px; width:100%; box-shadow:0 16px 60px rgba(0,0,0,.32); border:1px solid var(--line-strong); overflow:hidden; margin-top:6vh; animation:pop .17s ease-out; max-height:82vh; display:flex; flex-direction:column; }
  .hist-head{ display:flex; align-items:center; gap:12px; padding:16px 18px 12px; border-bottom:1px solid var(--line); }
  .hist-title{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:24px; color:var(--green); flex:1; }
  .hist-sum{ display:flex; gap:10px; padding:14px 18px; flex-wrap:wrap; }
  .hist-stat{ background:rgba(31,77,62,.08); border-radius:10px; padding:10px 14px; flex:1; min-width:120px; }
  .hist-stat .n{ font-family:'Teko',sans-serif; font-size:26px; font-weight:600; color:var(--green); line-height:1; }
  .hist-stat .l{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:rgba(74,52,36,.55); margin-top:3px; }
  .hist-list{ overflow-y:auto; padding:4px 12px 8px; }
  .hist-row{ display:flex; align-items:center; gap:12px; padding:11px 8px; border-bottom:1px solid var(--line); }
  .hist-row:last-child{ border-bottom:none; }
  .hist-amt{ font-family:'Teko',sans-serif; font-size:21px; font-weight:600; color:var(--green); min-width:78px; }
  .hist-mid{ flex:1; min-width:0; }
  .hist-when{ font-size:14px; color:var(--burgundy); }
  .hist-who{ font-size:13px; color:rgba(74,52,36,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-badge{ font-family:'Teko',sans-serif; text-transform:uppercase; font-size:11px; letter-spacing:.06em; padding:2px 7px 1px; border-radius:5px; background:rgba(244,181,176,.3); color:var(--burgundy); }
  .hist-foot{ padding:11px 18px; text-align:center; font-size:13px; color:rgba(74,52,36,.5); border-top:1px solid var(--line); font-style:italic; }
  .hist-loading{ text-align:center; padding:40px; color:rgba(74,52,36,.5); font-style:italic; }
  .empty-state-orig{ text-align:center; padding:84px 20px; color:rgba(74,52,36,.55); }
  .empty-state .big{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:26px; color:rgba(74,52,36,.4); }
  .empty-state p{ margin:8px 0 0; font-size:17px; }

  .fab{ position:fixed; right:18px; bottom:22px; z-index:60; width:62px; height:62px; border-radius:20px; background:var(--green); color:var(--cream); border:none; box-shadow:0 8px 24px rgba(31,77,62,.4); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .12s, filter .15s, box-shadow .15s; }
  .fab:hover{ filter:brightness(1.12); box-shadow:0 10px 28px rgba(31,77,62,.46); } .fab:active{ transform:scale(.93); } .fab.hide{ display:none; }

  .overlay{ position:fixed; inset:0; z-index:90; background:rgba(31,33,28,.46); backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:center; padding:28px 14px; overflow-y:auto; }
  .overlay.show{ display:flex; }
  @media(max-width:560px){ .overlay{ padding:12px 10px; } }

  .chooser-box{ background:var(--note); border-radius:18px; padding:24px 22px 26px; max-width:440px; width:100%; box-shadow:0 16px 60px rgba(0,0,0,.32); border:1px solid var(--line-strong); margin-top:7vh; animation:pop .17s ease-out; }
  .chooser-title{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:25px; color:var(--green); text-align:center; }
  .chooser-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
  .chooser-grid button{ display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:3px; padding:22px 16px; border-radius:14px; border:1px solid var(--line-strong); background:var(--cream); cursor:pointer; transition:background .14s, transform .1s, box-shadow .14s; }
  .chooser-grid button:hover{ background:#fff; box-shadow:var(--shadow); } .chooser-grid button:active{ transform:scale(.97); }
  .chooser-grid .nm{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:21px; font-weight:600; line-height:1; color:var(--burgundy); }
  .chooser-grid .sub{ font-style:italic; font-size:14px; color:rgba(74,52,36,.55); }

  .modal{ width:100%; max-width:560px; border-radius:16px; background:var(--note); box-shadow:0 16px 60px rgba(0,0,0,.32); border:1px solid var(--line-strong); overflow:hidden; animation:pop .17s ease-out; margin-bottom:40px; }
  @keyframes pop{ from{ transform:scale(.97); opacity:.5; } to{ transform:scale(1); opacity:1; } }
  .m-imgs{ display:flex; gap:8px; flex-wrap:wrap; padding:14px 18px 0; }
  .m-imgs .imthumb{ position:relative; width:74px; height:74px; border-radius:10px; overflow:hidden; border:1px solid var(--line-strong); }
  .m-imgs .imthumb img{ width:100%; height:100%; object-fit:cover; }
  .m-imgs .imthumb .x{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; width:20px; height:20px; border-radius:50%; font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .m-imgs .addimg{ width:74px; height:74px; border-radius:10px; border:1.5px dashed var(--line-strong); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; color:rgba(74,52,36,.5); font-size:12px; gap:2px; transition:border-color .14s,color .14s; }
  .m-imgs .addimg:hover{ border-color:var(--green); color:var(--green); }

  .m-pad{ padding:16px 20px 20px; }
  .m-title{ width:100%; border:none; outline:none; background:none; font-family:'Roboto Slab',Georgia,serif; font-size:22px; font-weight:600; color:var(--burgundy); margin:0 0 8px; }
  .m-title::placeholder{ color:rgba(74,52,36,.34); }

  .meta-bar{ display:flex; align-items:center; gap:9px; margin:4px 0 12px; flex-wrap:wrap; }
  .kind-tag{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:14px; font-weight:600; color:var(--green); background:rgba(31,77,62,.09); padding:5px 11px 3px; border-radius:7px; }
  .meta-summary{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:14px; color:var(--burgundy); background:none; border:1px solid var(--line-strong); border-radius:999px; padding:6px 13px 4px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .meta-summary:hover{ border-color:var(--green); }
  .meta-summary .udot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .meta-summary .chev{ opacity:.5; }
  .meta-panel{ background:rgba(242,234,221,.5); border:1px solid var(--line); border-radius:11px; padding:13px; margin:0 0 14px; }
  .opt{ font-style:italic; text-transform:none; letter-spacing:0; color:rgba(74,52,36,.45); font-family:'EB Garamond',serif; font-size:12px; }
  .field-label{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:13px; color:rgba(74,52,36,.55); margin:0 0 8px; display:flex; align-items:center; gap:8px; }

  .tl{ display:flex; align-items:center; gap:7px; }
  .tl .lamp{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:1px solid var(--line-strong); opacity:.3; transition:opacity .14s, box-shadow .14s, transform .1s; }
  .tl .lamp:hover{ transform:scale(1.08); }
  .tl .lamp.on{ opacity:1; box-shadow:0 0 0 2px rgba(242,234,221,.9), 0 0 0 3.5px currentColor; }
  .tl .lamp.go{ background:var(--go); color:var(--go); } .tl .lamp.amber{ background:var(--amber); color:var(--amber); } .tl .lamp.red{ background:var(--red); color:var(--red); }
  .tl .tl-label{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:16px; color:rgba(74,52,36,.7); min-width:62px; }
  .due-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .duechip{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:15px; font-weight:500; color:var(--burgundy); background:var(--note); border:1px solid var(--line-strong); border-radius:999px; padding:8px 14px 6px; cursor:pointer; transition:background .14s,color .14s,border-color .14s; }
  .duechip.on{ background:var(--green); color:var(--cream); border-color:var(--green); }

  .note-body{ width:100%; border:1px solid var(--line-strong); outline:none; background:var(--cream); resize:none; font-family:'EB Garamond',serif; font-size:18px; line-height:1.6; color:var(--burgundy); min-height:130px; border-radius:11px; padding:12px 14px; }
  .note-body:focus{ border-color:var(--green); }
  .note-body::placeholder{ color:rgba(74,52,36,.34); }

  .builder{ background:rgba(242,234,221,.55); border:1px solid var(--line); border-radius:11px; padding:12px; }
  .b-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:9px; }
  .b-size,.b-surface,.b-material,.b-placement{ font-family:'EB Garamond',serif; font-size:16px; color:var(--burgundy); background:var(--note); border:1px solid var(--line-strong); border-radius:8px; padding:9px 11px; outline:none; }
  .b-size{ flex:1; min-width:70px; } .b-surface{ flex:1.1; min-width:88px; } .b-material{ flex:1; min-width:82px; } .b-placement{ flex:1; min-width:88px; }
  .b-size:focus,.b-surface:focus,.b-material:focus,.b-placement:focus{ border-color:var(--green); }
  .it-color-row{ display:flex; align-items:center; gap:9px; }
  .it-color-name{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:14px; color:rgba(74,52,36,.65); min-width:60px; flex:none; }
  .it-swatches{ display:flex; gap:6px; overflow-x:auto; padding:2px 1px; -webkit-overflow-scrolling:touch; }
  .it-swatches::-webkit-scrollbar{ display:none; }
  .it-swatches .sw{ flex:none; width:22px; height:22px; border-radius:50%; border:1px solid rgba(74,52,36,.3); cursor:pointer; transition:transform .1s, box-shadow .12s; }
  .it-swatches .sw:hover{ transform:scale(1.12); }
  .it-swatches .sw.sel{ box-shadow:0 0 0 2px var(--note), 0 0 0 3.5px var(--green); }
  .qty-add{ display:flex; gap:10px; align-items:stretch; margin-top:11px; }
  .stepper{ display:flex; align-items:center; border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; background:var(--note); }
  .stepper button{ width:42px; height:46px; border:none; background:none; font-size:24px; line-height:1; color:var(--burgundy); cursor:pointer; }
  .stepper button:active{ background:rgba(74,52,36,.08); }
  .stepper .qv{ width:48px; text-align:center; font-family:'Teko',sans-serif; font-size:25px; color:var(--burgundy); }
  .add-batch{ flex:1; background:var(--green); color:var(--cream); border:none; border-radius:10px; font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:19px; font-weight:600; cursor:pointer; transition:filter .14s; }
  .add-batch:active{ filter:brightness(1.12); }

  .desc-label{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:13px; color:rgba(74,52,36,.55); margin:18px 0 8px; }
  .gen-empty{ font-size:14px; color:rgba(74,52,36,.5); font-style:italic; padding:6px 2px; }
  .gitem{ display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .gitem:last-child{ border-bottom:none; }
  .g-idx{ font-family:'Teko',sans-serif; font-size:15px; color:rgba(74,52,36,.4); width:20px; text-align:right; flex:none; }
  .gitem .cdot{ width:13px; height:13px; }
  .g-sum{ font-size:14px; color:var(--burgundy); flex:none; max-width:44%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .g-name{ flex:1; min-width:90px; border:1px solid var(--line-strong); border-radius:7px; padding:6px 9px; font-family:'EB Garamond',serif; font-size:15px; color:var(--burgundy); background:var(--note); outline:none; }
  .g-name:focus{ border-color:var(--green); }
  .g-rm{ cursor:pointer; opacity:.5; font-size:18px; padding:0 2px; flex:none; }

  .m-bar{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:14px 14px 14px; border-top:1px solid var(--line); }
  .m-bar .spacer{ margin-left:auto; }
  .m-done{ display:flex; align-items:center; gap:7px; font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:17px; font-weight:600; background:var(--go); color:#fff; border:none; cursor:pointer; padding:9px 16px 7px; border-radius:9px; }
  .m-close{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:18px; font-weight:600; background:var(--green); color:var(--cream); border:none; cursor:pointer; padding:9px 24px 7px; border-radius:9px; }
  .m-restore{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:17px; font-weight:600; background:transparent; color:var(--green); border:1px solid var(--green); cursor:pointer; padding:8px 16px 6px; border-radius:9px; }
  .m-forever{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:15px; font-weight:500; background:transparent; color:var(--red); border:none; cursor:pointer; padding:8px 10px; }
  .m-ghost{ font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:16px; font-weight:500; background:transparent; color:rgba(74,52,36,.7); border:none; cursor:pointer; padding:8px 12px; }

  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--burgundy); color:var(--cream); padding:12px 20px; border-radius:10px; z-index:120; box-shadow:0 6px 24px rgba(0,0,0,.25); font-size:16px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; display:flex; align-items:center; gap:14px; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast button{ background:none; border:none; color:var(--pink); cursor:pointer; font-family:'Teko',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:16px; font-weight:600; }

    h+='<div class="card-tags">'+tags+'</div></div>';
    if(o.trashed){ h+='<div class="card-bar"><span class="lbl" data-act="restore" data-id="'+o.id+'">Restore</span><button class="icon-btn" style="margin-left:auto" data-act="forever" data-id="'+o.id+'" title="Delete forever"><svg viewBox="0 0 24 24" fill="none" stroke="#D64545" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></div>'; }
    else { h+='<div class="card-bar"><button class="done-btn" data-act="done" data-id="'+o.id+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12l5 5L20 6"/></svg>Done</button><button class="icon-btn" style="margin-left:auto" data-act="trash" data-id="'+o.id+'" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="#D64545" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></div>'; }
    h+='</div>'; return h;
  }

  function wireCards(){ var board=$('board'); board.querySelectorAll('[data-card]').forEach(function(el){ el.addEventListener('click',function(e){ if(e.target.closest('[data-act]')||e.target.closest('[data-stop]'))return; openEditor(el.getAttribute('data-card')); }); }); board.querySelectorAll('[data-act]').forEach(function(el){ el.addEventListener('click',function(e){ e.stopPropagation(); var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'); if(a==='done')toTrash(id,'done'); else if(a==='trash')toTrash(id,'deleted'); else if(a==='restore')restore(id); else if(a==='forever')forever(id); }); }); }

  function toTrash(id,reason){ var o=getOrder(id); if(!o)return; o.trashed=true; o.trashedAt=Date.now(); o.trashReason=reason; render(); persist(); toast(reason==='done'?'Marked done — moved to trash':'Moved to trash', function(){ o.trashed=false; o.trashedAt=null; render(); persist(); }); }
  function restore(id){ var o=getOrder(id); if(!o)return; o.trashed=false; o.trashedAt=null; render(); persist(); toast('Restored to your board'); }
  function forever(id){ var idx=-1,rm=null; for(var i=0;i<state.orders.length;i++)if(state.orders[i].id===id){idx=i;rm=state.orders[i];break;} if(idx<0)return; state.orders.splice(idx,1); render(); persist(); toast('Deleted forever',function(){state.orders.splice(idx,0,rm);render();persist();}); }

  /* ===== chooser + editor ===== */
  var chooser=$('chooser'), overlay=$('overlay');
  $('fab').addEventListener('click',function(){ chooser.classList.add('show'); });
  chooser.addEventListener('click',function(){ chooser.classList.remove('show'); });
  chooser.querySelectorAll('button[data-type]').forEach(function(b){ b.addEventListener('click',function(){ chooser.classList.remove('show'); openEditorNew(b.getAttribute('data-type')); }); });

  function openEditorNew(type){ editing={ id:uid(),type:type,title:'',contact:'',body:'',urgency:'fcfs',designReady:false,items:[],images:[],due:'',duePreset:'',trashed:false,trashedAt:null,source:'manual',createdAt:Date.now(),updatedAt:Date.now(),isNew:true }; builder={size:'',color:'',surface:'',material:'',placement:'',qty:1}; fillModal(editing); buildBar(editing); overlay.classList.add('show'); setTimeout(function(){$('mTitle').focus();},60); }
  function openEditor(id){ var o=getOrder(id); if(!o)return; editing=o; if(!o.images)o.images=[]; if(!o.items)o.items=[]; builder={size:'',color:'',surface:'',material:'',placement:'',qty:1}; fillModal(o); buildBar(o); overlay.classList.add('show'); }
  function fillModal(o){ $('mTitle').value=o.title||''; $('kindTag').textContent=o.type; $('drRow').style.display=(o.type==='NOTE')?'none':'flex'; $('drSwitch').classList.toggle('on',!!o.designReady); renderImgs(); renderBody(); }


  function buildMetaControls(){
    var c=$('mTL'); c.innerHTML='';
    ['norush','fcfs','asap'].forEach(function(k){ var u=URGENCY[k]; var el=document.createElement('div'); el.className='lamp '+u.cls+(editing.urgency===k?' on':''); el.title=u.label; el.onclick=function(){ editing.urgency=k; c.querySelectorAll('.lamp').forEach(function(x){x.classList.remove('on');}); el.classList.add('on'); var lab=c.querySelector('.tl-label'); if(lab)lab.textContent=u.label; livePersist(); }; c.appendChild(el); });
    var lab=document.createElement('span'); lab.className='tl-label'; lab.textContent=URGENCY[editing.urgency||'fcfs'].label; c.appendChild(lab);
    var dc=$('mDue'); dc.innerHTML='';
    DUEPRESETS.forEach(function(p){ var b=document.createElement('button'); b.className='duechip'+(editing.duePreset===p[0]?' on':''); b.textContent=p[1]; b.onclick=function(){ if(editing.duePreset===p[0]){ editing.duePreset=''; editing.due=''; } else { editing.duePreset=p[0]; editing.due=computeDue(p[0]); } dc.querySelectorAll('.duechip').forEach(function(x){x.classList.remove('on');}); if(editing.duePreset)b.classList.add('on'); livePersist(); }; dc.appendChild(b); });
  }

  function renderImgs(){
    var c=$('mImgs'); c.innerHTML=''; var imgs=editing.images||[];
    imgs.forEach(function(uu,i){ var d=document.createElement('div'); d.className='imthumb'; d.innerHTML='<img src="'+uu+'"><span class="x">&times;</span>'; d.querySelector('.x').onclick=function(){ editing.images.splice(i,1); renderImgs(); livePersist(); }; c.appendChild(d); });
    if(imgs.length<3){ var add=document.createElement('div'); add.className='addimg'; add.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Photo'; add.onclick=function(){ $('fileInput').click(); }; c.appendChild(add); }
  }

  function renderBody(){
    buildMetaControls();
    var c=$('mBody'); c.innerHTML='';
    if(editing.type==='NOTE'){
      var ta=document.createElement('textarea'); ta.className='note-body'; ta.placeholder='Write your note…'; ta.value=editing.body||''; ta.oninput=function(e){editing.body=e.target.value;autoGrow(e.target,130);livePersist();}; c.appendChild(ta); setTimeout(function(){autoGrow(ta,130);},0);
      return;
    }
    // optional notes (placed below the items)
    var nt=document.createElement('textarea'); nt.className='notes-body'; nt.placeholder='Notes (optional)…'; nt.value=editing.body||''; nt.oninput=function(e){editing.body=e.target.value;autoGrow(e.target,66);livePersist();}; nt.style.marginTop='6px';
    // variant builder
    var bld=document.createElement('div'); bld.className='builder';
    var isEng=(editing.type==='Engraving');
    var r1=document.createElement('div'); r1.className='b-row';
    if(!isEng){ var bs=document.createElement('input'); bs.className='b-size'; bs.setAttribute('list','sizeList'); bs.placeholder='Size'; bs.value=builder.size; bs.oninput=function(e){builder.size=e.target.value;}; r1.appendChild(bs); }
    var bf=document.createElement('input'); bf.className='b-surface'; bf.setAttribute('list',isEng?'engSurfList':'surfList'); bf.placeholder=isEng?'Item':'Garment'; bf.value=builder.surface; bf.oninput=function(e){builder.surface=e.target.value;};
    var bm=document.createElement('input'); bm.className='b-material'; bm.setAttribute('list',isEng?'engMatList':'matList'); bm.placeholder='Material'; bm.value=builder.material; bm.oninput=function(e){builder.material=e.target.value;};
    var bp=null; if(!isEng){ bp=document.createElement('input'); bp.className='b-placement'; bp.setAttribute('list','placeList'); bp.placeholder='Placement'; bp.value=builder.placement; bp.oninput=function(e){builder.placement=e.target.value;}; }
    r1.appendChild(bf); r1.appendChild(bm); if(bp)r1.appendChild(bp); bld.appendChild(r1);
    bld.appendChild(colorStrip(function(){return builder.color;}, function(cc){builder.color=cc;}));
    var qa=document.createElement('div'); qa.className='qty-add';
    var step=document.createElement('div'); step.className='stepper';
    var minus=document.createElement('button'); minus.type='button'; minus.textContent='\u2212';
    var qv=document.createElement('span'); qv.className='qv'; qv.textContent=builder.qty;
    var plus=document.createElement('button'); plus.type='button'; plus.textContent='+';
    var addB=document.createElement('button'); addB.type='button'; addB.className='add-batch'; addB.textContent='Add '+builder.qty;
    minus.onclick=function(){ builder.qty=Math.max(1,builder.qty-1); qv.textContent=builder.qty; addB.textContent='Add '+builder.qty; };
    plus.onclick=function(){ builder.qty=builder.qty+1; qv.textContent=builder.qty; addB.textContent='Add '+builder.qty; };
    step.appendChild(minus); step.appendChild(qv); step.appendChild(plus);
    qa.appendChild(step); qa.appendChild(addB); bld.appendChild(qa);
    var list=document.createElement('div'); fillGen(list); c.appendChild(list);
    c.appendChild(nt); setTimeout(function(){autoGrow(nt,66);},0);
    var albl=document.createElement('div'); albl.className='desc-label'; albl.textContent='Add item'; c.appendChild(albl);
    c.appendChild(bld);
    addB.onclick=function(){ var n=Math.max(1,builder.qty||1); for(var i=0;i<n;i++)editing.items.push({size:builder.size,color:builder.color,surface:builder.surface,material:builder.material,placement:builder.placement,name:''}); fillGen(list); livePersist(); toast('Added '+n+(n>1?' items':' item')); };
  }

  function colorStrip(getC,setC){
    var crow=document.createElement('div'); crow.className='it-color-row';
    var nm=document.createElement('span'); nm.className='it-color-name'; nm.textContent=getC()||'Color'; crow.appendChild(nm);
    var strip=document.createElement('div'); strip.className='it-swatches';
    COLORS.forEach(function(col){ var s=document.createElement('span'); s.className='sw'+(getC()===col.n?' sel':''); s.style.background=col.h; s.title=col.n; s.onclick=function(){ var was=(getC()===col.n); strip.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel');}); if(was){ setC(''); nm.textContent='Color'; } else { setC(col.n); nm.textContent=col.n; s.classList.add('sel'); } }; strip.appendChild(s); });
    crow.appendChild(strip); return crow;
  }
  function fillGen(container){
    container.innerHTML='';
    if(!editing.items.length){ var e=document.createElement('div'); e.className='gen-empty'; e.textContent='No items yet — add one below.'; container.appendChild(e); return; }
    editing.items.forEach(function(it,i){
      var row=document.createElement('div'); row.className='gitem';
      var idx=document.createElement('span'); idx.className='g-idx'; idx.textContent=(i+1); row.appendChild(idx);
      var dot=document.createElement('span'); dot.className='cdot'; if(it.color){dot.style.background=colorHex(it.color);}else{dot.style.background='transparent';dot.style.borderStyle='dashed';} row.appendChild(dot);
      var sum=document.createElement('span'); sum.className='g-sum'; sum.textContent=comboText(it); row.appendChild(sum);
      var nm=document.createElement('input'); nm.className='g-name'; nm.placeholder='Name'; nm.value=it.name||''; nm.oninput=function(e){it.name=e.target.value;livePersist();}; row.appendChild(nm);
      var rm=document.createElement('span'); rm.className='g-rm'; rm.innerHTML='&times;'; rm.onclick=function(){editing.items.splice(i,1);fillGen(container);livePersist();}; row.appendChild(rm);
      container.appendChild(row);
    });
  }

  $('mTitle').addEventListener('input',function(e){editing.title=e.target.value;livePersist();});
  $('drSwitch').addEventListener('click',function(){ if(!editing)return; editing.designReady=!editing.designReady; $('drSwitch').classList.toggle('on',editing.designReady); livePersist(); });

  function buildBar(o){
    var bar=$('mBar'); bar.innerHTML='';
    if(o.isNew){ var dc=document.createElement('button'); dc.className='m-ghost'; dc.textContent='Discard'; dc.onclick=discard; bar.appendChild(dc); var sv=document.createElement('button'); sv.className='m-close spacer'; sv.textContent='Save'; sv.onclick=commitOrClose; bar.appendChild(sv); }
    else if(o.trashed){ var fv=document.createElement('button'); fv.className='m-forever'; fv.textContent='Delete forever'; fv.onclick=function(){var id=o.id;hideOverlay();forever(id);}; bar.appendChild(fv); var rs=document.createElement('button'); rs.className='m-restore spacer'; rs.textContent='Restore'; rs.onclick=function(){var id=o.id;hideOverlay();restore(id);}; bar.appendChild(rs); }
    else { var tr=document.createElement('button'); tr.className='m-delete'; tr.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Delete'; tr.onclick=function(){var id=o.id;hideOverlay();toTrash(id,'deleted');}; bar.appendChild(tr); var dn=document.createElement('button'); dn.className='m-done spacer'; dn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 12l5 5L20 6"/></svg>Mark done'; dn.onclick=function(){var id=o.id;hideOverlay();toTrash(id,'done');}; bar.appendChild(dn); var cl=document.createElement('button'); cl.className='m-close'; cl.textContent='Close'; cl.onclick=commitOrClose; bar.appendChild(cl); }
  }
  function hideOverlay(){ overlay.classList.remove('show'); editing=null; }
  function discard(){ hideOverlay(); render(); }
  function commitOrClose(){
    if(!editing){ overlay.classList.remove('show'); return; }
    editing.items=(editing.items||[]).filter(itemHas);
    if(editing.isNew){
      var hasText=(editing.title||'').trim()||(editing.body||'').trim()||(editing.images&&editing.images.length)||editing.items.length||editing.due;
      if(!hasText){ discard(); return; }
      delete editing.isNew; editing.updatedAt=Date.now(); state.orders.unshift(editing); hideOverlay(); persist(); render(); return;
    }
    editing.updatedAt=Date.now(); hideOverlay(); render();
  }
  overlay.addEventListener('click',commitOrClose);
  function autoGrow(el,min){ el.style.height='auto'; el.style.height=Math.max(min||40,el.scrollHeight)+'px'; }

  $('fileInput').addEventListener('change',function(e){ var files=Array.prototype.slice.call(e.target.files); if(!files.length||!editing)return; if(!editing.images)editing.images=[]; var slots=3-editing.images.length; if(slots<=0){toast('Up to 3 photos');e.target.value='';return;} files=files.slice(0,slots); var pending=files.length; files.forEach(function(f){ processImage(f,function(url){ if(url)editing.images.push(url); pending--; if(pending===0){ renderImgs(); livePersist(); } }); }); e.target.value=''; });

  window.addEventListener('message',function(e){ var d=e.data; if(!d||typeof d!=='object')return; if(d.type==='BROCH_ORDER'&&d.order)ingest(d.order); else if(d.type==='BROCH_DESIGN'&&d.image)ingest({image:d.image,title:d.title||'',body:d.body||''}); });
  try{ if(window.parent&&window.parent!==window)window.parent.postMessage({type:'BROCH_ORDERS_READY'},'*'); }catch(_){}
  function ingest(src){
    var type=src.type||(Array.isArray(src.types)&&src.types[0])||'NOTE'; if(type==='Print')type='Printing'; if(type==='N/A')type='NOTE'; if(TYPES.indexOf(type)<0)type='NOTE';
    var images=[]; if(src.image)images.push(src.image); if(Array.isArray(src.images))src.images.forEach(function(uu){if(images.length<3)images.push(uu);}); images=images.slice(0,3);
    var dueP=src.duePreset||''; var due=src.due||(dueP?computeDue(dueP):'');
    var o={ id:uid(),type:type,title:src.title||src.customer||'',contact:src.contact||src.phone||'',body:src.body||src.details||src.notes||'',urgency:src.urgency||'asap',designReady:!!src.designReady,items:Array.isArray(src.items)?src.items:[],images:images,due:due,duePreset:dueP,trashed:false,trashedAt:null,source:'online',createdAt:Date.now(),updatedAt:Date.now() };
    state.orders.unshift(o);
    if(ui.view==='trash')ui.view='board'; render(); persist(); toast('New online order'+(src.title?' — '+src.title:''));
  }
  function checkHash(){ if(location.hash.indexOf('#order=')===0){ try{ ingest(JSON.parse(decodeURIComponent(location.hash.slice(7)))); history.replaceState(null,'',location.pathname+location.search); }catch(_){}} }

  document.addEventListener('keydown',function(e){ if(e.key!=='Escape')return; if(chooser.classList.contains('show')){chooser.classList.remove('show');return;} if(overlay.classList.contains('show')){ if(editing&&editing.isNew)discard(); else commitOrClose(); } });

  // ── Payment history (hidden icon → overlay) ──────────────
  var _histLoaded=false;
  function openHist(){
    $('histOverlay').classList.add('show');
    if(!_histLoaded){ loadHist(); }
  }
  function closeHist(){ $('histOverlay').classList.remove('show'); }
  $('histBtn').addEventListener('click',openHist);
  $('histClose').addEventListener('click',closeHist);
  $('histOverlay').addEventListener('click',function(e){ if(e.target===$('histOverlay'))closeHist(); });

  function money(cents){ return '$'+(cents/100).toFixed(2); }
  function whenText(iso){
    try{ var d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
    catch(e){ return ''; }
  }
  function loadHist(){
    $('histList').innerHTML='<div class="hist-loading">Loading payments…</div>';
    $('histSum').innerHTML=''; $('histFoot').textContent='';
    fetch('/api/payments').then(function(r){return r.json();}).then(function(d){
      if(!d.ok){ $('histList').innerHTML='<div class="hist-loading">'+esc(d.error||'Could not load payments.')+'</div>'; return; }
      _histLoaded=true;
      var pays=(d.payments||[]).filter(function(p){return p.status==='COMPLETED';});
      if(!pays.length){ $('histList').innerHTML='<div class="hist-loading">No payments in the last 90 days.</div>'; return; }
      var total=pays.reduce(function(s,p){return s+(p.amount||0);},0);
      // this month
      var now=new Date(), mStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
      var monthPays=pays.filter(function(p){return new Date(p.createdAt).getTime()>=mStart;});
      var monthTotal=monthPays.reduce(function(s,p){return s+(p.amount||0);},0);
      $('histSum').innerHTML=
        '<div class="hist-stat"><div class="n">'+money(monthTotal)+'</div><div class="l">This month</div></div>'+
        '<div class="hist-stat"><div class="n">'+monthPays.length+'</div><div class="l">Orders this month</div></div>'+
        '<div class="hist-stat"><div class="n">'+money(total)+'</div><div class="l">Last 90 days</div></div>';
      $('histList').innerHTML=pays.map(function(p){
        var who=[]; if(p.cardBrand)who.push(p.cardBrand+(p.last4?' ····'+p.last4:'')); if(p.email)who.push(p.email);
        return '<div class="hist-row">'+
          '<div class="hist-amt">'+money(p.amount)+'</div>'+
          '<div class="hist-mid"><div class="hist-when">'+whenText(p.createdAt)+'</div>'+
          (who.length?'<div class="hist-who">'+esc(who.join(' · '))+'</div>':'')+'</div>'+
          (p.receipt?'<span class="hist-badge">#'+esc(p.receipt)+'</span>':'')+
        '</div>';
      }).join('');
      $('histFoot').textContent='Showing completed payments · last 90 days';
    }).catch(function(){
      $('histList').innerHTML='<div class="hist-loading">Could not reach the payment service.</div>';
    });
  }

  load(); checkHash();
})();
</script>
</body>
</html>
